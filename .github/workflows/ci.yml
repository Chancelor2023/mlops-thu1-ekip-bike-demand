name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR cancels the older, now useless run; runs on main are never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
          python-version: "3.12"

      # Fastest and most likely failures first
      - name: Lock file matches pyproject.toml
        run: uv lock --check
      - name: Install strictly from the lock
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Preflight
        run: uv run --locked python -m bike_demand.preflight

      # One step per marker, so the first red step names the failing group
      - name: Tests (infra)
        run: uv run --locked pytest -q -m infra
      - name: Tests (lab1)
        run: uv run --locked pytest -q -m lab1
      - name: Tests (exercise)
        run: uv run --locked pytest -q -m exercise
      - name: Tests (api)
        run: uv run --locked pytest -q -m api
      - name: Tests (regression)
        run: uv run --locked pytest -q -m regression -s

      # Last: the whole suite, so a test without a marker still runs
      - name: Full test suite
        run: uv run --locked pytest -q